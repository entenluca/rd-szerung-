<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrzeugtor Steuerung</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="hidden">
        <!-- Tor-Auswahl (Fernbedienung) -->
        <div id="selector-view" class="panel hidden">
            <header class="panel-header">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5v14"/>
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Tor-Fernbedienung</h1>
                    <p>Wähle ein Tor zum Steuern</p>
                </div>
                <button class="close-btn" id="btn-close-selector" title="Schließen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </header>

            <div class="gate-list" id="gate-list"></div>

            <footer class="panel-footer selector-footer">
                <span id="gate-count">0 Tore in Reichweite</span>
            </footer>
        </div>

        <!-- Tor-Steuerung -->
        <div id="control-view" class="panel hidden">
            <header class="panel-header">
                <button class="back-btn hidden" id="btn-back" title="Zurück zur Auswahl">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9h18v10H3z"/>
                        <path d="M5 9V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/>
                        <path d="M12 9v10"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1 id="gate-label">Fahrzeugtor</h1>
                    <p id="gate-status">Geschlossen</p>
                </div>
                <button class="close-btn" id="btn-close" title="Schließen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </header>

            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-label" id="progress-label">0%</span>
            </div>

            <div class="controls">
                <button class="control-btn open" id="btn-open">
                    <div class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                    </div>
                    <span class="btn-label">Öffnen</span>
                </button>

                <button class="control-btn stop" id="btn-stop">
                    <div class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="1"/>
                        </svg>
                    </div>
                    <span class="btn-label">Stopp</span>
                </button>

                <button class="control-btn close" id="btn-close-gate">
                    <div class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M12 5v14M5 12l7 7 7-7"/>
                        </svg>
                    </div>
                    <span class="btn-label">Schließen</span>
                </button>
            </div>

            <footer class="panel-footer">
                <div class="warning-indicator" id="warning-indicator">
                    <span class="warning-dot"></span>
                    <span>Tor in Bewegung</span>
                </div>
            </footer>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
